<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#60646C"/>
    </marker>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3c87f7"/>
      <stop offset="100%" stop-color="#7c5cfc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="#ffffff"/>

  <!-- main row boxes -->
  <g font-size="13" font-weight="600" fill="#111">
    <rect x="20" y="40" width="150" height="60" rx="12" fill="#F0F0F3"/>
    <text x="95" y="66" text-anchor="middle">Email</text>
    <text x="95" y="82" text-anchor="middle">Received</text>

    <rect x="215" y="40" width="150" height="60" rx="12" fill="#F0F0F3"/>
    <text x="290" y="66" text-anchor="middle">Order Details</text>
    <text x="290" y="82" text-anchor="middle">Extracted</text>

    <rect x="410" y="40" width="150" height="60" rx="12" fill="#ede9fe"/>
    <text x="485" y="66" text-anchor="middle" fill="#7c5cfc">Confidence</text>
    <text x="485" y="82" text-anchor="middle" fill="#7c5cfc">Checked</text>

    <rect x="605" y="40" width="150" height="60" rx="12" fill="#dafbe1"/>
    <text x="680" y="66" text-anchor="middle" fill="#1a7f37">Order</text>
    <text x="680" y="82" text-anchor="middle" fill="#1a7f37">Created</text>

    <rect x="800" y="40" width="150" height="60" rx="12" fill="#F0F0F3"/>
    <text x="875" y="66" text-anchor="middle">Confirmation</text>
    <text x="875" y="82" text-anchor="middle">Sent</text>
  </g>

  <!-- arrows main row -->
  <g stroke="#60646C" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="170" y1="70" x2="212" y2="70"/>
    <line x1="365" y1="70" x2="407" y2="70"/>
    <line x1="560" y1="70" x2="602" y2="70"/>
    <line x1="755" y1="70" x2="797" y2="70"/>
  </g>

  <!-- human checkpoint branch -->
  <path d="M485,100 C485,160 485,160 485,190" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
  <rect x="395" y="195" width="180" height="60" rx="12" fill="#fff8c5"/>
  <text x="485" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#9a6700">Sent for Quick</text>
  <text x="485" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#9a6700">Human Review</text>

  <path d="M575,225 C650,225 650,150 602,80" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4,4"/>

  <text x="500" y="285" text-anchor="middle" font-size="12" fill="#60646C">Low-confidence or incomplete details pause here — a person confirms them, then the order continues on its own.</text>
</svg>
